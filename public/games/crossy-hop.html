<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossy Hop</title>
<link rel="stylesheet" href="../assets/game.css">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>Crossy Hop</h1>
  <div class="stats"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <button class="btn" id="mute" title="Sound on/off">🔊</button>
</header>

<main class="stage">
  <div class="wrap">
    <canvas class="game" id="c" width="450" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">Crossy Hop</h2>
      <p id="ovText">Cross roads and rivers. Don't stand still too long!</p>
      <button class="btn primary" id="go">Play</button>
    </div>
  </div>
  <div class="touch-pad">
    <button class="btn" data-d="left">◀</button>
    <button class="btn" data-d="up">▲</button>
    <button class="btn" data-d="down">▼</button>
    <button class="btn" data-d="right">▶</button>
  </div>
</main>

<p class="help">Arrow keys / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to hop, or swipe (tap = hop forward). Ride the logs across water.</p>

<script src="../assets/common.js"></script>
<script>
(() => {
  Arcade.preventScroll();
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const C = 50, COLS = 9, W = 450, H = 600, P = W + 300;
  const CAR_COLORS = ['#ff4f5e', '#4f7bff', '#ffb13e', '#b56bff', '#3ee6c8'];

  let lanes, pl, hop, cam, score, state = 'menu', nextMove, started, deathT, deathKind, frame;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  bestEl.textContent = Arcade.get('crossy_best', 0);

  function makeLane(i) {
    if (i < 4) return { type: 'grass', trees: new Set(i === 0 ? [0, 8] : []) };
    const diff = Math.min(1, i / 150);
    const prev = lanes[i - 1];
    let r = Math.random();
    // Keep rivers from getting too long and always give a breather after them.
    const riverRun = (k) => { let n = 0; while (lanes[k - n] && lanes[k - n].type === 'river') n++; return n; };
    if (prev.type === 'river' && riverRun(i - 1) >= 3) r = 0.1;
    if (r < 0.3) {
      const trees = new Set();
      const count = Math.floor(Math.random() * (2 + diff * 3));
      for (let k = 0; k < count; k++) trees.add(Math.floor(Math.random() * COLS));
      // Never block the whole row or the tile the player would land on from a log.
      if (trees.size >= COLS - 1) trees.clear();
      return { type: 'grass', trees };
    }
    if (r < 0.68) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const truck = Math.random() < 0.3;
      const w = truck ? 110 : 64;
      const n = truck ? 2 : 2 + Math.floor(Math.random() * 2);
      const v = dir * (1 + Math.random() * 1.4 + diff * 2);
      const off = Math.random() * P;
      const color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
      const items = [];
      for (let k = 0; k < n; k++) items.push({ x: ((off + (k * P) / n) % P) - 150, w, color, truck });
      return { type: 'road', v, items };
    }
    const dir = prev.type === 'river' ? -Math.sign(prev.v) : (Math.random() < 0.5 ? 1 : -1);
    const v = dir * (0.8 + Math.random() * 1.1 + diff);
    const n = 3;
    const off = Math.random() * P;
    const items = [];
    for (let k = 0; k < n; k++) items.push({ x: ((off + (k * P) / n) % P) - 150, w: 110 + Math.floor(Math.random() * 3) * 25 });
    return { type: 'river', v, items };
  }

  function lane(i) {
    while (lanes.length <= i) lanes.push(makeLane(lanes.length));
    return lanes[i];
  }

  function reset() {
    lanes = [];
    lane(20);
    pl = { x: 4 * C, row: 1 };
    hop = null; cam = 0; score = 0; nextMove = null; started = false; deathT = 0; frame = 0;
    scoreEl.textContent = 0;
  }

  function tryMove(d) {
    if (state !== 'play') return;
    if (hop) { nextMove = d; return; }
    let tx = pl.x, tr = pl.row;
    if (d === 'up') tr++;
    if (d === 'down') tr--;
    if (d === 'left') tx -= C;
    if (d === 'right') tx += C;
    // Snap to the grid when stepping on/off logs.
    tx = Math.round(tx / C) * C;
    if (tr < 0 || tx < 0 || tx > (COLS - 1) * C) return;
    const L = lane(tr);
    if (L.type === 'grass' && L.trees.has(tx / C)) return;
    started = true;
    hop = { fx: pl.x, fr: pl.row, tx, tr, t: 0 };
    pl.row = tr; pl.x = tx;
    Arcade.beep(420 + (d === 'up' ? 120 : 0), 0.04, 'square', 0.04);
  }

  function die(kind) {
    if (state !== 'play') return;
    state = 'dead'; deathKind = kind; deathT = 0;
    if (kind === 'water') Arcade.noise(0.4, 0.15); else Arcade.beep(160, 0.3, 'sawtooth', 0.1, -100);
    const best = Arcade.best('crossy', score);
    bestEl.textContent = best;
    setTimeout(() => {
      document.getElementById('ovTitle').textContent = kind === 'eagle' ? 'Too slow!' : kind === 'water' ? 'Splash!' : 'Squashed!';
      document.getElementById('ovText').textContent = `Score ${score} · Best ${best}`;
      document.getElementById('go').textContent = 'Play again';
      document.getElementById('ov').classList.remove('hidden');
    }, 700);
  }

  function update() {
    frame++;
    // Move traffic and logs everywhere on screen.
    for (let i = Math.max(0, Math.floor(cam) - 2); i < cam + 14; i++) {
      const L = lane(i);
      if (L.type === 'grass') continue;
      for (const it of L.items) {
        it.x += L.v;
        if (L.v > 0 && it.x > W + 150) it.x -= P;
        if (L.v < 0 && it.x < -150) it.x += P;
      }
    }
    if (state !== 'play') { deathT++; return; }

    if (hop) {
      hop.t += 1 / 7;
      if (hop.t >= 1) {
        hop = null;
        if (nextMove) { const m = nextMove; nextMove = null; tryMove(m); }
      }
    }

    const L = lane(pl.row);
    const midHop = hop && hop.t < 0.5;
    if (!midHop) {
      if (L.type === 'road') {
        for (const it of L.items) {
          if (pl.x + 10 < it.x + it.w && pl.x + C - 10 > it.x) return die('car');
        }
      } else if (L.type === 'river' && !hop) {
        const cx = pl.x + C / 2;
        const log = L.items.find((it) => cx > it.x && cx < it.x + it.w);
        if (!log) return die('water');
        pl.x += L.v;
        if (pl.x < -C / 2 || pl.x > W - C / 2) return die('water');
      }
    }

    if (pl.row > score) { score = pl.row; scoreEl.textContent = score; }
    if (started) cam += 0.007 + Math.min(0.012, score * 0.00004);
    if (pl.row - cam > 5) cam += (pl.row - 5 - cam) * 0.08;
    if (pl.row < cam - 0.2) die('eagle');
  }

  const sy = (row) => H - (row - cam + 1) * C;

  function draw() {
    const top = Math.floor(cam) + 13;
    for (let i = Math.max(0, Math.floor(cam) - 1); i <= top; i++) {
      const L = lane(i), y = sy(i);
      if (L.type === 'grass') {
        ctx.fillStyle = i % 2 ? '#8ee35b' : '#82d652';
        ctx.fillRect(0, y, W, C);
        for (const t of L.trees) {
          ctx.fillStyle = '#7a4a24';
          ctx.fillRect(t * C + 20, y + 30, 10, 16);
          ctx.fillStyle = '#2f9e44';
          ctx.fillRect(t * C + 6, y + 4, 38, 30);
          ctx.fillStyle = '#40c057';
          ctx.fillRect(t * C + 10, y + 6, 30, 10);
        }
      } else if (L.type === 'road') {
        ctx.fillStyle = '#3b3f4a';
        ctx.fillRect(0, y, W, C);
        ctx.fillStyle = '#6b7080';
        for (let x = 10; x < W; x += 60) ctx.fillRect(x, y + C - 3, 30, 3);
        for (const it of L.items) {
          const dir = Math.sign(L.v);
          ctx.fillStyle = it.color;
          ctx.fillRect(it.x, y + 8, it.w, C - 16);
          ctx.fillStyle = 'rgba(255,255,255,.6)';
          const wx = dir > 0 ? it.x + it.w - 22 : it.x + 8;
          ctx.fillRect(wx, y + 12, 14, C - 24);
          ctx.fillStyle = '#111';
          ctx.fillRect(it.x + 8, y + 4, 14, 6); ctx.fillRect(it.x + it.w - 22, y + 4, 14, 6);
          ctx.fillRect(it.x + 8, y + C - 10, 14, 6); ctx.fillRect(it.x + it.w - 22, y + C - 10, 14, 6);
          ctx.fillStyle = '#ffec99';
          ctx.fillRect(dir > 0 ? it.x + it.w - 3 : it.x, y + 12, 3, 6);
          ctx.fillRect(dir > 0 ? it.x + it.w - 3 : it.x, y + C - 18, 3, 6);
        }
      } else {
        ctx.fillStyle = '#4dabf7';
        ctx.fillRect(0, y, W, C);
        ctx.fillStyle = 'rgba(255,255,255,.25)';
        for (let x = (frame * 0.5 + i * 40) % 80 - 80; x < W; x += 80) ctx.fillRect(x, y + 20, 26, 3);
        for (const it of L.items) {
          ctx.fillStyle = '#8d5a2b';
          ctx.fillRect(it.x, y + 9, it.w, C - 18);
          ctx.fillStyle = '#a9713c';
          ctx.fillRect(it.x, y + 9, it.w, 6);
          ctx.fillStyle = '#6b4220';
          ctx.fillRect(it.x + it.w - 8, y + 9, 8, C - 18);
        }
      }
    }

    // Player (a chunky chicken)
    let px = pl.x, prow = pl.row, lift = 0;
    if (hop) {
      px = hop.fx + (hop.tx - hop.fx) * hop.t;
      prow = hop.fr + (hop.tr - hop.fr) * hop.t;
      lift = Math.sin(hop.t * Math.PI) * 12;
    }
    const y = sy(prow) - lift;
    if (state === 'dead' && deathKind === 'water') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px + C / 2, y + C / 2, 6 + deathT, 0, Math.PI * 2); ctx.stroke();
    } else if (state !== 'dead' || deathKind !== 'eagle') {
      const flat = state === 'dead' && deathKind === 'car';
      const h = flat ? 12 : 32, oy = flat ? 30 : 8;
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      ctx.fillRect(px + 10, sy(prow) + 38, 30, 6);
      ctx.fillStyle = '#fff';
      ctx.fillRect(px + 11, y + oy, 28, h);
      if (!flat) {
        ctx.fillStyle = '#ff4f5e'; ctx.fillRect(px + 20, y + 3, 10, 6);
        ctx.fillStyle = '#ffa94d'; ctx.fillRect(px + 21, y + 20, 8, 6);
        ctx.fillStyle = '#000'; ctx.fillRect(px + 15, y + 14, 4, 4); ctx.fillRect(px + 31, y + 14, 4, 4);
      }
    }
    if (state === 'dead' && deathKind === 'eagle') {
      ctx.fillStyle = '#4a3b2a';
      const ey = Math.min(y, deathT * 12 - 60);
      ctx.beginPath(); ctx.moveTo(px - 40, ey); ctx.lineTo(px + 25, ey + 30); ctx.lineTo(px + 90, ey); ctx.lineTo(px + 25, ey + 12); ctx.fill();
    }

    if (!started && state === 'play') {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0, H - 110, W, 40);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Hop forward to start!', W / 2, H - 84); ctx.textAlign = 'left';
    }
  }

  const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const d = keyMap[e.key] || keyMap[e.key.toLowerCase()];
    if (d) tryMove(d);
    if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') begin();
  });
  Arcade.onSwipe(cv, (d) => tryMove(d === 'tap' ? 'up' : d));
  cv.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  document.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); tryMove(b.dataset.d); }));

  function begin() {
    reset(); state = 'play'; Arcade.audio();
    document.getElementById('ov').classList.add('hidden');
  }
  document.getElementById('go').addEventListener('click', begin);

  reset();
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= 1000 / 60) { if (state !== 'menu') update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
