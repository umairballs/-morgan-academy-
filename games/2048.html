<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="stylesheet" href="../assets/game.css">
<style>
  .board {
    --n: 4;
    position: relative;
    width: min(92vw, 460px);
    aspect-ratio: 1;
    background: #1c2242;
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(var(--n), 1fr);
    gap: 10px;
    touch-action: none;
    user-select: none;
  }
  .cell {
    border-radius: 10px;
    background: #262d52;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(18px, 7vw, 40px);
    color: #0b0d17;
  }
  .cell.big { font-size: clamp(14px, 5.5vw, 32px); }
  .cell.huge { font-size: clamp(12px, 4.5vw, 26px); }
  .cell.new { animation: pop .18s ease-out; }
  .cell.merged { animation: bump .18s ease-out; }
  @keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.15); } }
  .top { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>2048</h1>
  <div class="stats"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <button class="btn" id="mute" title="Sound on/off">🔊</button>
</header>

<main class="stage">
  <div class="top">
    <button class="btn" id="undo">↶ Undo</button>
    <button class="btn primary" id="new">New game</button>
  </div>
  <div class="wrap">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="ov">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="touch-pad">
        <button class="btn primary" id="ovBtn">Keep going</button>
        <button class="btn" id="ovNew">New game</button>
      </div>
    </div>
  </div>
</main>

<p class="help">
  Slide tiles with the arrow keys, <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>, or swipe.
  Matching numbers merge. Reach the <b>2048</b> tile to win!
</p>

<script src="../assets/common.js"></script>
<script>
(() => {
  Arcade.preventScroll();
  const N = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const COLORS = {
    2: '#eef1ff', 4: '#d9e0ff', 8: '#ffb86b', 16: '#ff9651', 32: '#ff7258', 64: '#ff4f4f',
    128: '#ffe177', 256: '#ffd84d', 512: '#ffcf22', 1024: '#7dff9a', 2048: '#5ee7ff',
  };

  let grid, score, won, keepGoing, history = [];
  let fresh = new Set(), merged = new Set();

  const cells = [];
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cells.push(d);
  }

  function empty() {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]);
    return out;
  }

  function addTile() {
    const e = empty();
    if (!e.length) return;
    const [r, c] = e[Math.floor(Math.random() * e.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    fresh.add(r * N + c);
  }

  function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(0));
    score = 0; won = false; keepGoing = false; history = [];
    fresh = new Set(); merged = new Set();
    addTile(); addTile();
    hideOverlay();
    render();
    save();
  }

  // Slides one line toward index 0. Returns [newLine, gained, mergedIndexes].
  function slide(line) {
    const vals = line.filter(Boolean);
    const out = [], m = [];
    let gained = 0;
    for (let i = 0; i < vals.length; i++) {
      if (vals[i] === vals[i + 1]) {
        out.push(vals[i] * 2); gained += vals[i] * 2; m.push(out.length - 1); i++;
      } else out.push(vals[i]);
    }
    while (out.length < N) out.push(0);
    return [out, gained, m];
  }

  function move(dir) {
    const before = JSON.stringify(grid);
    const prev = { grid: grid.map((r) => r.slice()), score };
    fresh = new Set(); merged = new Set();
    let gainedAll = 0;
    for (let i = 0; i < N; i++) {
      // Build the line in the direction of travel.
      const idx = [];
      for (let j = 0; j < N; j++) {
        if (dir === 'left') idx.push([i, j]);
        if (dir === 'right') idx.push([i, N - 1 - j]);
        if (dir === 'up') idx.push([j, i]);
        if (dir === 'down') idx.push([N - 1 - j, i]);
      }
      const [out, gained, m] = slide(idx.map(([r, c]) => grid[r][c]));
      gainedAll += gained;
      idx.forEach(([r, c], k) => { grid[r][c] = out[k]; });
      m.forEach((k) => merged.add(idx[k][0] * N + idx[k][1]));
    }
    if (JSON.stringify(grid) === before) return;
    history.push(prev);
    if (history.length > 20) history.shift();
    score += gainedAll;
    if (gainedAll) Arcade.beep(300 + Math.log2(gainedAll) * 40, 0.07, 'triangle', 0.08);
    addTile();
    render();
    check();
    save();
  }

  function canMove() {
    if (empty().length) return true;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (c + 1 < N && grid[r][c] === grid[r][c + 1]) return true;
      if (r + 1 < N && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  function check() {
    const best = Arcade.best('2048', score);
    bestEl.textContent = best;
    if (!won && grid.some((r) => r.includes(2048))) {
      won = true;
      showOverlay('You win! 🎉', `You made 2048 with a score of ${score}.`, true);
    } else if (!canMove()) {
      showOverlay('Game over', `Final score ${score}.`, false);
    }
  }

  function showOverlay(title, text, canContinue) {
    document.getElementById('ovTitle').textContent = title;
    document.getElementById('ovText').textContent = text;
    document.getElementById('ovBtn').style.display = canContinue ? '' : 'none';
    document.getElementById('ov').classList.remove('hidden');
  }
  function hideOverlay() { document.getElementById('ov').classList.add('hidden'); }

  function render() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = grid[r][c], el = cells[r * N + c];
      el.textContent = v || '';
      el.style.background = v ? (COLORS[v] || '#b77dff') : '';
      el.className = 'cell' + (v >= 1024 ? ' huge' : v >= 128 ? ' big' : '') +
        (fresh.has(r * N + c) ? ' new' : '') + (merged.has(r * N + c) ? ' merged' : '');
    }
    scoreEl.textContent = score;
  }

  function save() { Arcade.set('2048_state', { grid, score, won }); }

  const keyMap = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key] || keyMap[e.key.toLowerCase()];
    if (dir && document.getElementById('ov').classList.contains('hidden')) move(dir);
  });
  Arcade.onSwipe(boardEl, (d) => {
    if (d !== 'tap' && document.getElementById('ov').classList.contains('hidden')) move(d);
  });

  document.getElementById('new').addEventListener('click', newGame);
  document.getElementById('ovNew').addEventListener('click', newGame);
  document.getElementById('ovBtn').addEventListener('click', () => { keepGoing = true; hideOverlay(); });
  document.getElementById('undo').addEventListener('click', () => {
    const p = history.pop();
    if (!p) return;
    grid = p.grid; score = p.score;
    fresh = new Set(); merged = new Set();
    hideOverlay();
    render();
    save();
  });

  bestEl.textContent = Arcade.get('2048_best', 0);
  const saved = Arcade.get('2048_state', null);
  if (saved && saved.grid && saved.grid.length === N) {
    grid = saved.grid; score = saved.score || 0; won = !!saved.won;
    render();
    if (!canMove()) showOverlay('Game over', `Final score ${score}.`, false);
  } else {
    newGame();
  }
})();
</script>
</body>
</html>
