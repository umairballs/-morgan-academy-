<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<link rel="stylesheet" href="../assets/game.css">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>Snake</h1>
  <div class="stats"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <button class="btn" id="mute" title="Sound on/off">🔊</button>
</header>

<main class="stage">
  <div class="wrap">
    <canvas class="game" id="c" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">Snake</h2>
      <p id="ovText">Eat the apples, grow longer, don't bite yourself.</p>
      <div class="touch-pad">
        <button class="btn primary" data-mode="walls">Classic (walls)</button>
        <button class="btn" data-mode="wrap">No walls</button>
      </div>
    </div>
  </div>
  <div class="touch-pad">
    <button class="btn" data-d="left">◀</button>
    <button class="btn" data-d="up">▲</button>
    <button class="btn" data-d="down">▼</button>
    <button class="btn" data-d="right">▶</button>
  </div>
</main>

<p class="help">Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer, or swipe. Gold apples are worth 5 but vanish quickly. <kbd>P</kbd> pauses.</p>

<script src="../assets/common.js"></script>
<script>
(() => {
  Arcade.preventScroll();
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const N = 24, S = 20;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let snake, dir, queue, food, gold, score, state = 'menu', mode = 'walls', tickT, grow;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  bestEl.textContent = Arcade.get('snake_best', 0);

  function freeCell() {
    while (true) {
      const p = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)];
      if (!snake.some((s) => s[0] === p[0] && s[1] === p[1]) && !(food && food[0] === p[0] && food[1] === p[1])) return p;
    }
  }

  function reset() {
    snake = [[8, 12], [7, 12], [6, 12]];
    dir = 'right'; queue = []; score = 0; tickT = 0; grow = 0; gold = null; food = null;
    food = freeCell();
    scoreEl.textContent = 0;
  }

  function speed() { return Math.max(55, 120 - snake.length * 1.5); }

  function turn(d) {
    const last = queue.length ? queue[queue.length - 1] : dir;
    const [lx, ly] = DIRS[last], [nx, ny] = DIRS[d];
    if (lx + nx === 0 && ly + ny === 0) return; // no reversing
    if (d === last) return;
    if (queue.length < 3) queue.push(d);
  }

  function end() {
    state = 'over';
    Arcade.noise(0.3, 0.15);
    const best = Arcade.best('snake', score);
    bestEl.textContent = best;
    document.getElementById('ovTitle').textContent = 'Game Over';
    document.getElementById('ovText').textContent = `Score ${score} · Length ${snake.length} · Best ${best}`;
    document.getElementById('ov').classList.remove('hidden');
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    let hx = snake[0][0] + dx, hy = snake[0][1] + dy;
    if (mode === 'wrap') { hx = (hx + N) % N; hy = (hy + N) % N; }
    else if (hx < 0 || hy < 0 || hx >= N || hy >= N) return end();
    // The tail moves away this tick unless we're growing.
    const body = grow > 0 ? snake : snake.slice(0, -1);
    if (body.some((s) => s[0] === hx && s[1] === hy)) return end();
    snake.unshift([hx, hy]);
    if (grow > 0) grow--; else snake.pop();

    if (hx === food[0] && hy === food[1]) {
      score++; grow += 1;
      Arcade.beep(520 + (score % 8) * 40, 0.07, 'square', 0.06);
      food = freeCell();
      if (!gold && Math.random() < 0.18) gold = { p: freeCell(), t: 45 };
    }
    if (gold) {
      if (hx === gold.p[0] && hy === gold.p[1]) {
        score += 5; grow += 3; gold = null;
        Arcade.beep(880, 0.08, 'square', 0.06);
        setTimeout(() => Arcade.beep(1175, 0.12, 'square', 0.06), 80);
      } else if (--gold.t <= 0) gold = null;
    }
    scoreEl.textContent = score;
  }

  function draw() {
    ctx.fillStyle = '#0f1a14';
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if ((x + y) % 2) { ctx.fillStyle = '#12201a'; ctx.fillRect(x * S, y * S, S, S); }
    }
    if (mode === 'walls') { ctx.strokeStyle = '#2f6b4a'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, cv.width - 4, cv.height - 4); }
    if (!snake) return;

    // Apple
    const fx = food[0] * S + S / 2, fy = food[1] * S + S / 2;
    ctx.fillStyle = '#ff4f5e';
    ctx.beginPath(); ctx.arc(fx, fy + 1, S / 2 - 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5eff8a'; ctx.fillRect(fx - 1, fy - S / 2 + 1, 3, 5);
    if (gold) {
      ctx.globalAlpha = gold.t < 12 && gold.t % 2 ? 0.4 : 1;
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(gold.p[0] * S + S / 2, gold.p[1] * S + S / 2 + 1, S / 2 - 1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = `hsl(${140 - t * 40}, 80%, ${55 - t * 20}%)`;
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(s[0] * S + pad, s[1] * S + pad, S - pad * 2, S - pad * 2, 5);
      ctx.fill();
    });
    // Eyes
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
    ctx.fillStyle = '#000';
    const cx = hx * S + S / 2 + dx * 4, cy = hy * S + S / 2 + dy * 4;
    ctx.beginPath(); ctx.arc(cx - dy * 4, cy - dx * 4, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + dy * 4, cy + dx * 4, 2.2, 0, Math.PI * 2); ctx.fill();

    if (state === 'pause') {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 30px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('PAUSED', cv.width / 2, cv.height / 2); ctx.textAlign = 'left';
    }
  }

  const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  window.addEventListener('keydown', (e) => {
    if ((e.key === 'p' || e.key === 'P') && (state === 'play' || state === 'pause')) {
      state = state === 'play' ? 'pause' : 'play'; return;
    }
    const d = keyMap[e.key] || keyMap[e.key.toLowerCase()];
    if (d && state === 'play') turn(d);
    if ((e.key === 'Enter' || e.key === ' ') && (state === 'menu' || state === 'over')) begin(mode);
  });
  Arcade.onSwipe(cv, (d) => { if (d !== 'tap' && state === 'play') turn(d); });
  document.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (state === 'play') turn(b.dataset.d); }));

  function begin(m) {
    mode = m; reset(); state = 'play'; Arcade.audio();
    document.getElementById('ov').classList.add('hidden');
  }
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => begin(b.dataset.mode)));

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(200, now - last);
    last = now;
    if (state === 'play') {
      tickT += dt;
      while (tickT >= speed() && state === 'play') { tickT -= speed(); tick(); }
    }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
